server:
  port: 8080

spring:
  application:
    name: job-portal
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:mysql://localhost:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:JobPortalSecretKeyMustBeAtLeastThirtyTwoCharsLong!}
    expiration-ms: 86400000
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
