server:
  port: 8080

spring:
  application:
    name: careermatch-ai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:h2:mem:careermatchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:CareerMatchAISecretKeyMustBeAtLeastThirtyTwoCharactersLongForSecurity2026!}
    expiration-ms: 86400000
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origin: ${FRONTEND_URL:*}
