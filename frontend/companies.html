<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Job Opportunities – CareerMatch AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container py-4 pb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h2 class="fw-bold mb-1">Side-by-Side Job Comparison</h2>
        <p class="text-muted small mb-0">Evaluate offers and openings across match scores, compensation, required skills, and deadlines.</p>
      </div>
      <a href="jobs.html" class="btn btn-outline-primary btn-sm rounded-pill px-3">
        <i class="fas fa-search me-1"></i> Browse & Select Jobs
      </a>
    </div>

    <!-- Comparison Summary Banner -->
    <div id="comparison-summary" class="alert alert-primary border-primary d-none rounded-3 shadow-sm mb-4">
      <div class="row align-items-center g-3">
        <div class="col-md-6">
          <div class="d-flex align-items-center gap-2">
            <i class="fas fa-crown text-warning fs-4"></i>
            <div>
              <div class="small fw-semibold text-muted">Best Match for Your Profile:</div>
              <div class="fw-bold text-dark" id="best-match-title">--</div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="d-flex align-items-center gap-2">
            <i class="fas fa-money-bill-wave text-success fs-4"></i>
            <div>
              <div class="small fw-semibold text-muted">Highest Compensation Package:</div>
              <div class="fw-bold text-dark" id="highest-salary-title">--</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Comparison Grid Container -->
    <div id="comparison-grid" class="table-responsive">
      <table class="table table-bordered custom-card bg-white align-middle shadow-sm">
        <thead class="bg-light text-center" id="comparison-thead">
          <!-- Dynamically generated headers -->
        </thead>
        <tbody id="comparison-tbody">
          <!-- Rows for Match %, Salary, Exp, Mode, Location, Skills, Actions -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const idsParam = urlParams.get('ids') || '1,2,3'; // default to top 3 jobs if none selected

    async function loadComparison() {
      const jobIds = idsParam.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id));

      try {
        const res = await Api.compareJobs(jobIds);
        if (res.success && res.data) {
          renderComparisonTable(res.data);
        }
      } catch (err) {
        UI.showToast('Failed to compare jobs: ' + err.message, 'error');
      }
    }

    function renderComparisonTable(data) {
      const jobs = data.jobs || [];
      if (jobs.length === 0) {
        document.getElementById('comparison-grid').innerHTML = `
          <div class="custom-card p-5 text-center text-muted">
            <h5>No jobs selected to compare</h5>
            <a href="jobs.html" class="btn btn-primary btn-sm rounded-pill mt-2">Select Jobs in Search</a>
          </div>
        `;
        return;
      }

      // Summary Banner
      if (data.bestMatchJobTitle) {
        document.getElementById('best-match-title').textContent = `${data.bestMatchJobTitle}`;
        document.getElementById('highest-salary-title').textContent = `${data.highestSalaryJobTitle}`;
        document.getElementById('comparison-summary').classList.remove('d-none');
      }

      // Thead
      let theadHtml = `<tr><th style="width: 220px;" class="bg-light text-start p-3">Feature / Metric</th>`;
      jobs.forEach(j => {
        theadHtml += `
          <th class="p-3 text-center">
            <h6 class="fw-bold mb-1 text-dark">${j.title}</h6>
            <div class="small text-muted mb-2">${j.employer ? j.employer.companyName : 'Company'}</div>
            ${UI.getMatchBadge(j.matchScore)}
          </th>
        `;
      });
      theadHtml += `</tr>`;
      document.getElementById('comparison-thead').innerHTML = theadHtml;

      // Tbody
      let tbodyHtml = '';

      // 1. Match Score
      tbodyHtml += `<tr><td class="fw-bold text-muted small p-3">AI Match Score</td>`;
      jobs.forEach(j => {
        tbodyHtml += `<td class="text-center p-3"><span class="fs-5 fw-extrabold text-primary">${j.matchScore || '--'}%</span></td>`;
      });
      tbodyHtml += `</tr>`;

      // 2. Salary Range
      tbodyHtml += `<tr><td class="fw-bold text-muted small p-3">Salary Package</td>`;
      jobs.forEach(j => {
        tbodyHtml += `<td class="text-center p-3 fw-bold text-success">${UI.formatSalaryRange(j.salaryMin, j.salaryMax)}</td>`;
      });
      tbodyHtml += `</tr>`;

      // 3. Experience Required
      tbodyHtml += `<tr><td class="fw-bold text-muted small p-3">Experience Criteria</td>`;
      jobs.forEach(j => {
        tbodyHtml += `<td class="text-center p-3 text-muted">${j.experienceYears || 0} years required</td>`;
      });
      tbodyHtml += `</tr>`;

      // 4. Work Mode & Location
      tbodyHtml += `<tr><td class="fw-bold text-muted small p-3">Work Mode & Location</td>`;
      jobs.forEach(j => {
        tbodyHtml += `<td class="text-center p-3"><span class="badge bg-info-subtle text-info">${j.workMode ? j.workMode.replace('_', ' ') : 'Hybrid'}</span><div class="small text-muted mt-1">${j.location || 'Remote'}</div></td>`;
      });
      tbodyHtml += `</tr>`;

      // 5. Application Deadline
      tbodyHtml += `<tr><td class="fw-bold text-muted small p-3">Application Deadline</td>`;
      jobs.forEach(j => {
        tbodyHtml += `<td class="text-center p-3">${UI.getDeadlineBadge(j.daysLeft, j.isClosingSoon)}</td>`;
      });
      tbodyHtml += `</tr>`;

      // 6. Required Skills
      tbodyHtml += `<tr><td class="fw-bold text-muted small p-3">Required Tech Stack</td>`;
      jobs.forEach(j => {
        const pills = (j.requiredSkillsList || []).map(s => `<span class="skill-pill skill-neutral">${s}</span>`).join('');
        tbodyHtml += `<td class="text-center p-3">${pills}</td>`;
      });
      tbodyHtml += `</tr>`;

      // 7. Actions
      tbodyHtml += `<tr><td class="fw-bold text-muted small p-3">Actions</td>`;
      jobs.forEach(j => {
        tbodyHtml += `
          <td class="text-center p-3">
            <div class="d-flex justify-content-center gap-2">
              <a href="job-details.html?id=${j.id}" class="btn btn-outline-primary btn-sm rounded-pill px-3">View</a>
              <a href="interview.html?jobId=${j.id}" class="btn btn-outline-warning btn-sm rounded-pill text-dark">Prep Kit</a>
              <a href="job-details.html?id=${j.id}&action=apply" class="btn btn-primary btn-sm rounded-pill px-3">Apply</a>
            </div>
          </td>
        `;
      });
      tbodyHtml += `</tr>`;

      document.getElementById('comparison-tbody').innerHTML = tbodyHtml;
    }

    loadComparison();
  </script>
</body>
</html>
