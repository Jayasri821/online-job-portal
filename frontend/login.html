<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – CareerMatch AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card custom-card p-4 p-md-5 border-0 shadow-lg">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary p-3 rounded-circle mb-3">
              <i class="fas fa-lock fs-3"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to your CareerMatch AI account</p>
          </div>

          <div id="error-alert" class="alert alert-danger d-none small py-2"></div>

          <form id="login-form">
            <div class="mb-3">
              <label for="email" class="form-label small fw-bold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label small fw-bold mb-0">Password</label>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text bg-white"><i class="fas fa-key text-muted"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill mb-3">
              <i class="fas fa-sign-in-alt me-2"></i> Sign In
            </button>
          </form>

          <div class="text-center small text-muted mb-4">
            Don't have an account? <a href="register.html" class="text-primary fw-semibold">Sign Up</a>
          </div>

          <!-- Quick 1-Click Demo Logins -->
          <div class="border-top pt-3">
            <p class="text-center text-muted small fw-bold text-uppercase mb-2" style="font-size: 0.75rem;">1-Click Demo Logins</p>
            <div class="d-flex flex-column gap-2">
              <button class="btn btn-outline-primary btn-sm text-start d-flex align-items-center justify-content-between" onclick="fillAndLogin('seeker@careermatch.com', 'Password@123')">
                <span><i class="fas fa-user-graduate me-2"></i> Job Seeker (Jayasri)</span>
                <span class="badge bg-primary-subtle text-primary">Demo</span>
              </button>
              <button class="btn btn-outline-info btn-sm text-start d-flex align-items-center justify-content-between text-dark" onclick="fillAndLogin('recruiter@google.com', 'Password@123')">
                <span><i class="fas fa-building me-2 text-info"></i> Employer (Google Cloud Recruiter)</span>
                <span class="badge bg-info-subtle text-info">Demo</span>
              </button>
              <button class="btn btn-outline-secondary btn-sm text-start d-flex align-items-center justify-content-between" onclick="fillAndLogin('admin@careermatch.com', 'Password@123')">
                <span><i class="fas fa-shield-alt me-2 text-dark"></i> System Admin</span>
                <span class="badge bg-secondary-subtle text-secondary">Demo</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillAndLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('error-alert');
      const loginBtn = document.getElementById('login-btn');

      errorAlert.classList.add('d-none');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

      try {
        const response = await Api.login({ email, password });
        if (response.success && response.data) {
          Auth.setSession(response.data);
          UI.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            Auth.redirectToDashboard();
          }, 800);
        } else {
          throw new Error(response.message || 'Login failed');
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Invalid email or password';
        errorAlert.classList.remove('d-none');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Sign In';
      }
    });
  </script>
</body>
</html>
