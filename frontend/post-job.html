<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Job Opening – CareerMatch AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container py-4 pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="fw-bold mb-1">Post New Job Opening</h2>
            <p class="text-muted small mb-0">Publish an opening to trigger real-time AI matching with qualified candidate profiles.</p>
          </div>
          <a href="employer-dashboard.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
          </a>
        </div>

        <div class="card custom-card p-4 p-md-5 border-0 shadow-sm">
          <form id="post-job-form">
            <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
              <i class="fas fa-briefcase me-2"></i>Job Information
            </h5>

            <div class="row g-3 mb-4">
              <div class="col-12">
                <label class="form-label small fw-bold">Job Title *</label>
                <input type="text" class="form-control" id="title" placeholder="e.g. Java Full Stack Developer" required>
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Required Technical Skills * (comma-separated)</label>
                <input type="text" class="form-control" id="requiredSkills" placeholder="e.g. Java, Spring Boot, MySQL, REST API, React, HTML, CSS" required>
                <div class="form-text small text-muted">The AI Matching Engine scores candidates heavily (50%) based on these required skills.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Job Location</label>
                <input type="text" class="form-control" id="location" placeholder="e.g. Hyderabad, India" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Work Mode *</label>
                <select class="form-select" id="workMode" required>
                  <option value="HYBRID" selected>Hybrid</option>
                  <option value="WORK_FROM_HOME">Work From Home (Remote)</option>
                  <option value="ON_SITE">On-site</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Employment Type *</label>
                <select class="form-select" id="jobType" required>
                  <option value="FULL_TIME" selected>Full Time</option>
                  <option value="PART_TIME">Part Time</option>
                  <option value="INTERNSHIP">Internship</option>
                  <option value="CONTRACT">Contract</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Required Experience (Years) *</label>
                <input type="number" class="form-control" id="experienceYears" value="0" min="0" max="30" required>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-bold">Minimum Annual Salary (₹)</label>
                <input type="number" class="form-control" id="salaryMin" placeholder="e.g. 500000" step="50000">
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-bold">Maximum Annual Salary (₹)</label>
                <input type="number" class="form-control" id="salaryMax" placeholder="e.g. 800000" step="50000">
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-bold">Application Deadline</label>
                <input type="date" class="form-control" id="applicationDeadline">
              </div>
            </div>

            <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">
              <i class="fas fa-file-alt me-2"></i>Job Description & Requirements
            </h5>

            <div class="row g-3 mb-4">
              <div class="col-12">
                <label class="form-label small fw-bold">Overview / Summary *</label>
                <textarea class="form-control" id="description" rows="4" placeholder="Describe the role, project scope, team environment, and core mission..." required></textarea>
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Key Responsibilities</label>
                <textarea class="form-control" id="responsibilities" rows="4" placeholder="- Build scalable backend microservices using Spring Boot&#10;- Implement frontend modules in HTML5/CSS3/JS&#10;- Write unit and integration tests"></textarea>
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Qualifications & Educational Criteria</label>
                <textarea class="form-control" id="qualifications" rows="3" placeholder="- B.Tech/B.E in Computer Science or related degree&#10;- Strong problem solving and communication skills"></textarea>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="employer-dashboard.html" class="btn btn-light rounded-pill px-4">Cancel</a>
              <button type="submit" id="btn-submit-job" class="btn btn-primary rounded-pill px-5 fw-semibold shadow-sm">
                <i class="fas fa-paper-plane me-1"></i> Publish Job Opening
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (!Auth.requireAuth(['EMPLOYER', 'ADMIN'])) {
      // redirected
    }

    // Set default deadline to 14 days from now
    const today = new Date();
    today.setDate(today.getDate() + 14);
    document.getElementById('applicationDeadline').value = today.toISOString().split('T')[0];

    document.getElementById('post-job-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('btn-submit-job');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Publishing...';

      const payload = {
        title: document.getElementById('title').value.trim(),
        requiredSkills: document.getElementById('requiredSkills').value.trim(),
        location: document.getElementById('location').value.trim(),
        workMode: document.getElementById('workMode').value,
        jobType: document.getElementById('jobType').value,
        experienceYears: parseInt(document.getElementById('experienceYears').value || '0'),
        salaryMin: document.getElementById('salaryMin').value ? parseInt(document.getElementById('salaryMin').value) : null,
        salaryMax: document.getElementById('salaryMax').value ? parseInt(document.getElementById('salaryMax').value) : null,
        applicationDeadline: document.getElementById('applicationDeadline').value || null,
        description: document.getElementById('description').value.trim(),
        responsibilities: document.getElementById('responsibilities').value.trim(),
        qualifications: document.getElementById('qualifications').value.trim()
      };

      try {
        const res = await Api.postJob(payload);
        if (res.success && res.data) {
          UI.showToast('🎉 Job posted successfully! Candidates will now see real-time match rankings.', 'success');
          setTimeout(() => {
            window.location.href = 'employer-dashboard.html';
          }, 1000);
        } else {
          throw new Error(res.message || 'Job creation failed');
        }
      } catch (err) {
        UI.showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane me-1"></i> Publish Job Opening';
      }
    });
  </script>
</body>
</html>
