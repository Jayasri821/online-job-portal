<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Jobs – CareerMatch AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <!-- Search Header -->
  <div class="bg-white border-bottom py-4 mb-4">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-lg-5">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="search-query" class="form-control bg-light border-start-0" placeholder="Job title, skill, company (e.g. Java, Spring Boot, React)...">
          </div>
        </div>
        <div class="col-lg-4">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fas fa-map-marker-alt text-muted"></i></span>
            <input type="text" id="search-location" class="form-control bg-light border-start-0" placeholder="Location (e.g. Hyderabad, Bangalore, Remote)...">
          </div>
        </div>
        <div class="col-lg-3 d-flex gap-2">
          <button id="search-btn" class="btn btn-primary w-100 rounded-pill fw-semibold">
            <i class="fas fa-search me-1"></i> Find Jobs
          </button>
          <button id="reset-btn" class="btn btn-outline-secondary rounded-pill px-3" title="Reset Filters">
            <i class="fas fa-undo"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="container pb-5">
    <div class="row g-4">
      <!-- Sidebar Filters -->
      <div class="col-lg-3">
        <div class="card custom-card p-3 border-0 shadow-sm sticky-top" style="top: 85px;">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0"><i class="fas fa-sliders-h me-2 text-primary"></i>Filters</h6>
            <span class="badge bg-light text-muted border" id="results-count">0 jobs</span>
          </div>

          <!-- Sort Filter -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted text-uppercase">Sort By</label>
            <select class="form-select form-select-sm" id="sort-select">
              <option value="best_match" selected>🎯 Best Match Score</option>
              <option value="closing_soon">⏰ Closing Soon (Deadline)</option>
              <option value="highest_salary">💰 Highest Salary</option>
              <option value="latest">✨ Latest Posted</option>
            </select>
          </div>

          <!-- Work Mode Filter -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted text-uppercase">Work Mode</label>
            <select class="form-select form-select-sm" id="work-mode-select">
              <option value="">All Work Modes</option>
              <option value="WORK_FROM_HOME">Work From Home (Remote)</option>
              <option value="HYBRID">Hybrid</option>
              <option value="ON_SITE">On-site</option>
            </select>
          </div>

          <!-- Job Type Filter -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted text-uppercase">Job Type</label>
            <select class="form-select form-select-sm" id="job-type-select">
              <option value="">All Job Types</option>
              <option value="FULL_TIME">Full Time</option>
              <option value="PART_TIME">Part Time</option>
              <option value="INTERNSHIP">Internship</option>
              <option value="CONTRACT">Contract</option>
            </select>
          </div>

          <!-- Min Salary Filter -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted text-uppercase">Minimum Salary</label>
            <select class="form-select form-select-sm" id="salary-select">
              <option value="">Any Salary</option>
              <option value="400000">₹4+ LPA</option>
              <option value="600000">₹6+ LPA</option>
              <option value="800000">₹8+ LPA</option>
              <option value="1200000">₹12+ LPA</option>
              <option value="1500000">₹15+ LPA</option>
            </select>
          </div>

          <!-- Experience Filter -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted text-uppercase">Max Experience</label>
            <select class="form-select form-select-sm" id="exp-select">
              <option value="">Any Experience</option>
              <option value="0">Fresher (0 Years)</option>
              <option value="1">Up to 1 Year</option>
              <option value="2">Up to 2 Years</option>
              <option value="3">Up to 3 Years</option>
            </select>
          </div>

          <div class="alert alert-info py-2 px-3 mb-0 small border-0 bg-info-subtle text-info">
            <i class="fas fa-info-circle me-1"></i> Match scores update dynamically based on your registered skills.
          </div>
        </div>
      </div>

      <!-- Jobs Grid -->
      <div class="col-lg-9">
        <!-- Floating Comparison Action Bar -->
        <div id="compare-bar" class="alert alert-primary border-primary d-none d-flex justify-content-between align-items-center mb-3 shadow-sm rounded-3">
          <div>
            <i class="fas fa-columns me-2"></i>
            <span class="fw-semibold" id="compare-count-text">0 jobs selected for comparison</span>
          </div>
          <button id="btn-compare-now" class="btn btn-primary btn-sm rounded-pill px-3" onclick="goToComparison()">
            Compare Side-by-Side <i class="fas fa-arrow-right ms-1"></i>
          </button>
        </div>

        <div id="jobs-container" class="d-flex flex-column gap-3">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const selectedForCompare = new Set();

    async function fetchJobs() {
      const container = document.getElementById('jobs-container');
      UI.showSpinner('jobs-container', 'Analyzing job openings with AI match engine...');

      const query = document.getElementById('search-query').value.trim();
      const location = document.getElementById('search-location').value.trim();
      const workMode = document.getElementById('work-mode-select').value;
      const jobType = document.getElementById('job-type-select').value;
      const minSalary = document.getElementById('salary-select').value;
      const maxExp = document.getElementById('exp-select').value;
      const sort = document.getElementById('sort-select').value;

      const params = {};
      if (query) params.q = query;
      if (location) params.location = location;
      if (workMode) params.workMode = workMode;
      if (jobType) params.jobType = jobType;
      if (minSalary) params.minSalary = minSalary;
      if (maxExp) params.maxExp = maxExp;
      if (sort) params.sort = sort;

      try {
        const response = await Api.getJobs(params);
        if (response.success && response.data) {
          renderJobs(response.data);
        } else {
          container.innerHTML = `<div class="alert alert-warning">No jobs found matching your criteria.</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Error loading jobs: ${err.message}</div>`;
      }
    }

    function renderJobs(jobs) {
      const container = document.getElementById('jobs-container');
      document.getElementById('results-count').textContent = `${jobs.length} jobs`;

      if (jobs.length === 0) {
        container.innerHTML = `
          <div class="custom-card p-5 text-center text-muted">
            <i class="fas fa-search fs-1 mb-3 text-muted"></i>
            <h5>No matching jobs found</h5>
            <p class="small">Try adjusting your filters or search keywords.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = jobs.map(job => {
        const matchBadge = UI.getMatchBadge(job.matchScore);
        const deadlineBadge = UI.getDeadlineBadge(job.daysLeft, job.isClosingSoon);
        const matchedPills = (job.matchedSkills || []).slice(0, 5).map(s => `<span class="skill-pill skill-matched">✓ ${s}</span>`).join('');
        const missingPills = (job.missingSkills || []).slice(0, 4).map(s => `<span class="skill-pill skill-missing">✗ ${s}</span>`).join('');
        const isChecked = selectedForCompare.has(job.id) ? 'checked' : '';

        return `
          <div class="job-card custom-card">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
              <div class="d-flex align-items-start gap-3">
                <div class="form-check mt-1">
                  <input class="form-check-input" type="checkbox" value="${job.id}" id="compare-${job.id}" ${isChecked} onchange="toggleCompare(${job.id}, this)">
                  <label class="form-check-label small text-muted" for="compare-${job.id}">Compare</label>
                </div>
                <div>
                  <h5 class="fw-bold mb-1">
                    <a href="job-details.html?id=${job.id}" class="text-dark text-decoration-none hover-primary">${job.title}</a>
                  </h5>
                  <div class="text-muted small">
                    <i class="fas fa-building me-1"></i> ${job.employer ? job.employer.companyName : 'Confidential'} &bull; 
                    <i class="fas fa-map-marker-alt ms-1 me-1"></i> ${job.location || 'Remote'}
                  </div>
                </div>
              </div>

              <div class="d-flex flex-column align-items-end gap-1">
                ${matchBadge}
                ${deadlineBadge}
              </div>
            </div>

            <p class="text-muted small mb-2 text-truncate-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
              ${job.description}
            </p>

            <div class="d-flex flex-wrap gap-3 my-2 small text-muted">
              <span><i class="fas fa-money-bill-wave text-success me-1"></i> ${UI.formatSalaryRange(job.salaryMin, job.salaryMax)}</span>
              <span><i class="fas fa-user-clock text-primary me-1"></i> ${job.experienceYears || 0} yrs exp</span>
              <span><i class="fas fa-laptop-house text-info me-1"></i> ${job.workMode ? job.workMode.replace('_', ' ') : 'Hybrid'}</span>
              <span><i class="fas fa-briefcase text-secondary me-1"></i> ${job.jobType ? job.jobType.replace('_', ' ') : 'Full Time'}</span>
            </div>

            <div class="bg-light p-2 rounded-2 my-2 border">
              <div class="d-flex flex-wrap align-items-center gap-1">
                <span class="small fw-semibold text-muted me-1">Skills:</span>
                ${matchedPills}
                ${missingPills}
              </div>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 pt-2 border-top gap-2">
              <a href="job-details.html?id=${job.id}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                <i class="fas fa-info-circle me-1"></i> View Details & Breakdown
              </a>

              <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="toggleSaveJob(${job.id}, ${job.isSaved})" title="Save Job">
                  <i class="${job.isSaved ? 'fas fa-bookmark text-primary' : 'far fa-bookmark'}"></i> ${job.isSaved ? 'Saved' : 'Save'}
                </button>
                <a href="interview.html?jobId=${job.id}" class="btn btn-outline-warning btn-sm rounded-pill text-dark">
                  <i class="fas fa-graduation-cap me-1"></i> Prep Interview
                </a>
                <a href="job-details.html?id=${job.id}&action=apply" class="btn btn-primary btn-sm rounded-pill px-3">
                  ${job.hasApplied ? 'Applied (' + job.applicationStatus + ')' : 'Apply Now'}
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCompare(jobId, checkbox) {
      if (checkbox.checked) {
        if (selectedForCompare.size >= 3) {
          alert('You can compare up to 3 jobs at a time.');
          checkbox.checked = false;
          return;
        }
        selectedForCompare.add(jobId);
      } else {
        selectedForCompare.delete(jobId);
      }
      updateCompareBar();
    }

    function updateCompareBar() {
      const bar = document.getElementById('compare-bar');
      const count = selectedForCompare.size;
      if (count > 0) {
        bar.classList.remove('d-none');
        document.getElementById('compare-count-text').textContent = `${count} job${count > 1 ? 's' : ''} selected for side-by-side comparison`;
      } else {
        bar.classList.add('d-none');
      }
    }

    function goToComparison() {
      const ids = Array.from(selectedForCompare).join(',');
      window.location.href = `companies.html?ids=${ids}`;
    }

    async function toggleSaveJob(id, isSaved) {
      if (!Auth.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }
      try {
        if (isSaved) {
          await Api.unsaveJob(id);
          UI.showToast('Job removed from saved list', 'info');
        } else {
          await Api.saveJob(id);
          UI.showToast('Job saved to your bookmarks!', 'success');
        }
        fetchJobs();
      } catch (err) {
        UI.showToast(err.message, 'error');
      }
    }

    document.getElementById('search-btn').addEventListener('click', fetchJobs);
    document.getElementById('search-query').addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchJobs(); });
    document.getElementById('search-location').addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchJobs(); });
    
    // Live search as user types
    let searchTimeout;
    document.getElementById('search-query').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(fetchJobs, 300);
    });
    document.getElementById('search-location').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(fetchJobs, 300);
    });

    document.getElementById('sort-select').addEventListener('change', fetchJobs);
    document.getElementById('work-mode-select').addEventListener('change', fetchJobs);
    document.getElementById('job-type-select').addEventListener('change', fetchJobs);
    document.getElementById('salary-select').addEventListener('change', fetchJobs);
    document.getElementById('exp-select').addEventListener('change', fetchJobs);

    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('search-query').value = '';
      document.getElementById('search-location').value = '';
      document.getElementById('work-mode-select').value = '';
      document.getElementById('job-type-select').value = '';
      document.getElementById('salary-select').value = '';
      document.getElementById('exp-select').value = '';
      document.getElementById('sort-select').value = 'best_match';
      fetchJobs();
    });

    // Check query params on load
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('q')) document.getElementById('search-query').value = urlParams.get('q');
    if (urlParams.get('sort')) document.getElementById('sort-select').value = urlParams.get('sort');

    fetchJobs();
  </script>
</body>
</html>
