<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – CareerMatch AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card custom-card p-4 p-md-5 border-0 shadow-lg">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary p-3 rounded-circle mb-2">
              <i class="fas fa-user-plus fs-3"></i>
            </div>
            <h3 class="fw-bold">Create Your Account</h3>
            <p class="text-muted small">Unlock intelligent career matching & AI readiness guidance</p>
          </div>

          <!-- Role Toggle -->
          <div class="btn-group w-100 mb-4 p-1 bg-light rounded-pill border" role="group">
            <input type="radio" class="btn-check" name="roleToggle" id="role-seeker" value="JOB_SEEKER" checked autocomplete="off" onchange="toggleRoleForm()">
            <label class="btn btn-outline-primary border-0 rounded-pill fw-semibold py-2" for="role-seeker">
              <i class="fas fa-user-graduate me-2"></i> I am a Job Seeker / Student
            </label>

            <input type="radio" class="btn-check" name="roleToggle" id="role-employer" value="EMPLOYER" autocomplete="off" onchange="toggleRoleForm()">
            <label class="btn btn-outline-primary border-0 rounded-pill fw-semibold py-2" for="role-employer">
              <i class="fas fa-building me-2"></i> I am an Employer / Recruiter
            </label>
          </div>

          <div id="error-alert" class="alert alert-danger d-none small py-2"></div>

          <form id="register-form">
            <input type="hidden" id="role" value="JOB_SEEKER">

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Full Name *</label>
                <input type="text" class="form-control" id="fullName" placeholder="e.g. Jayasri" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Email Address *</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Password * (Min 6 chars)</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" minlength="6" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="+91 9876543210">
              </div>
            </div>

            <!-- JOB SEEKER SPECIFIC FIELDS -->
            <div id="seeker-fields">
              <h6 class="fw-bold text-primary border-bottom pb-2 mb-3 mt-4">
                <i class="fas fa-graduation-cap me-1"></i> Education & Profile Details
              </h6>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">College / University</label>
                  <input type="text" class="form-control" id="education" placeholder="e.g. JNTU Hyderabad">
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-bold">Degree / Branch</label>
                  <input type="text" class="form-control" id="degree" placeholder="e.g. B.Tech CSE">
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-bold">Graduation Year</label>
                  <input type="number" class="form-control" id="graduationYear" placeholder="2025" min="2000" max="2030">
                </div>
                <div class="col-12">
                  <label class="form-label small fw-bold">Technical Skills * (comma-separated)</label>
                  <input type="text" class="form-control" id="skills" placeholder="e.g. Java, Spring Boot, SQL, REST API, React, HTML, CSS" required>
                  <div class="form-text small text-muted">These skills are used to dynamically calculate your Match Score against jobs.</div>
                </div>
              </div>

              <h6 class="fw-bold text-primary border-bottom pb-2 mb-3 mt-4">
                <i class="fas fa-sliders-h me-1"></i> Career & Job Preferences
              </h6>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Preferred Job Role</label>
                  <input type="text" class="form-control" id="preferredRole" placeholder="e.g. Java Full Stack Developer">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Preferred Location</label>
                  <input type="text" class="form-control" id="preferredLocation" placeholder="e.g. Hyderabad, Bangalore">
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold">Experience (Years)</label>
                  <input type="number" class="form-control" id="experienceYears" value="0" min="0" max="40">
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold">Expected Annual Salary (₹ INR)</label>
                  <input type="number" class="form-control" id="expectedSalary" placeholder="e.g. 650000" step="50000">
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold">Preferred Work Mode</label>
                  <select class="form-select" id="preferredWorkMode">
                    <option value="HYBRID" selected>Hybrid</option>
                    <option value="WORK_FROM_HOME">Work From Home (Remote)</option>
                    <option value="ON_SITE">On-site</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- EMPLOYER SPECIFIC FIELDS -->
            <div id="employer-fields" class="d-none">
              <h6 class="fw-bold text-primary border-bottom pb-2 mb-3 mt-4">
                <i class="fas fa-building me-1"></i> Company Details
              </h6>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Company Name *</label>
                  <input type="text" class="form-control" id="companyName" placeholder="e.g. ABC Technologies">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Industry Sector</label>
                  <input type="text" class="form-control" id="industry" placeholder="e.g. Software & IT Services">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Company Location / HQ</label>
                  <input type="text" class="form-control" id="companyLocation" placeholder="e.g. Hyderabad, India">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Company Website</label>
                  <input type="url" class="form-control" id="website" placeholder="https://example.com">
                </div>
                <div class="col-12">
                  <label class="form-label small fw-bold">Company Overview</label>
                  <textarea class="form-control" id="companyDescription" rows="3" placeholder="Brief description about your company, culture and mission"></textarea>
                </div>
              </div>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill mt-4">
              <i class="fas fa-user-check me-2"></i> Complete Registration
            </button>
          </form>

          <div class="text-center small text-muted mt-4">
            Already have an account? <a href="login.html" class="text-primary fw-semibold">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function toggleRoleForm() {
      const isSeeker = document.getElementById('role-seeker').checked;
      document.getElementById('role').value = isSeeker ? 'JOB_SEEKER' : 'EMPLOYER';
      if (isSeeker) {
        document.getElementById('seeker-fields').classList.remove('d-none');
        document.getElementById('employer-fields').classList.add('d-none');
        document.getElementById('skills').setAttribute('required', 'required');
      } else {
        document.getElementById('seeker-fields').classList.add('d-none');
        document.getElementById('employer-fields').classList.remove('d-none');
        document.getElementById('skills').removeAttribute('required');
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const errorAlert = document.getElementById('error-alert');
      const submitBtn = document.getElementById('submit-btn');

      errorAlert.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...';

      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value.trim(),
        role: role
      };

      if (role === 'JOB_SEEKER') {
        payload.education = document.getElementById('education').value.trim();
        payload.degree = document.getElementById('degree').value.trim();
        payload.graduationYear = document.getElementById('graduationYear').value ? parseInt(document.getElementById('graduationYear').value) : null;
        payload.skills = document.getElementById('skills').value.trim();
        payload.preferredRole = document.getElementById('preferredRole').value.trim();
        payload.preferredLocation = document.getElementById('preferredLocation').value.trim();
        payload.experienceYears = parseInt(document.getElementById('experienceYears').value || '0');
        payload.expectedSalary = document.getElementById('expectedSalary').value ? parseInt(document.getElementById('expectedSalary').value) : null;
        payload.preferredWorkMode = document.getElementById('preferredWorkMode').value;
      } else {
        payload.companyName = document.getElementById('companyName').value.trim();
        payload.industry = document.getElementById('industry').value.trim();
        payload.companyLocation = document.getElementById('companyLocation').value.trim();
        payload.website = document.getElementById('website').value.trim();
        payload.companyDescription = document.getElementById('companyDescription').value.trim();
      }

      try {
        const res = await Api.register(payload);
        if (res.success && res.data) {
          Auth.setSession(res.data);
          UI.showToast('Account created successfully!', 'success');
          setTimeout(() => {
            Auth.redirectToDashboard();
          }, 800);
        } else {
          throw new Error(res.message || 'Registration failed');
        }
      } catch (err) {
        errorAlert.textContent = err.message || 'Registration failed. Please check your inputs.';
        errorAlert.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-user-check me-2"></i> Complete Registration';
      }
    });
  </script>
</body>
</html>
